name: Validate integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test requirements
        run: python -m pip install pytest
      - name: Compile Python source
        run: python -m compileall -q custom_components/water_treatment_monitor
      - name: Archive and schedule tests
        run: python -m pytest -q tests
      - name: Frontend checks
        run: |
          node --check custom_components/water_treatment_monitor/frontend/water-treatment-card.js
          node tests/test_frontend.cjs
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS repository validation
        uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Home Assistant integration validation
        uses: home-assistant/actions/hassfest@master
